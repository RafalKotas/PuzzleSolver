version: '3.8'

services:
  mysql-nonogram:
    image: mysql:8
    container_name: mysql-puzzles
    ports:
      - "3336:3306"
    environment:
      MYSQL_ROOT_PASSWORD: HubZdziuBD7aM?
      MYSQL_DATABASE: puzzles
      MYSQL_USER: puzzlesuser
      MYSQL_PASSWORD: puzzlespassword
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      retries: 5
    volumes:
      - mysql-data:/var/lib/mysql

  postgres-sonar:
    image: postgres:13
    container_name: postgres-sonar
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - postgres-sonar-data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonarqube
    depends_on:
      - postgres-sonar
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions

volumes:
  mysql-data:
  postgres-sonar-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
